spring.application.name=light-ai-server
server.port=8080
light-ai.server.shutdown-timeout-seconds=30

# ---- Redis 共享运行状态（Standalone 必需）----
light-ai.redis.uri=${LIGHT_AI_REDIS_URI:redis://127.0.0.1:6379/0}
light-ai.redis.namespace=${LIGHT_AI_REDIS_NAMESPACE:light-ai}
light-ai.redis.capacity-lease-ms=150000
light-ai.redis.queue-default-max-size=1000

# ---- 管理面（LightAiAdminAutoConfiguration）----
light-ai.admin.runtime-mode=STANDALONE_SERVER
light-ai.admin.timezone=Asia/Shanghai

# ---- 认证与安全（C-001：启用本机回环管理员信任，开箱可用）----
light-ai.server.auth.trusted-local=true

# ---- 凭证秘密加密主密钥（Base64 32 字节；生产环境请务必通过环境变量重写）----
light-ai.admin.secret-master-key-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
light-ai.admin.secret-master-key-id=default-master-key

# ---- 内部实例认证口令与 Token Pepper ----
# /internal 默认拒绝；部署方配置 internal-instance-credentials.<实例UUID>=独立口令
light-ai.admin.access-token-pepper=light-ai-access-token-pepper-default

# ---- 数据库与迁移（MIGRATE 启动时自动建表与初始化种子数据）----
light-ai.storage.schema-mode=MIGRATE

# 默认开发轻量 H2 数据库（MySQL 兼容模式，零外部依赖秒级启动）：
spring.datasource.url=jdbc:h2:mem:lightai;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 生产环境切换示例（取消注释即可连接外部库）：
# PostgreSQL:
# spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/lightai
# spring.datasource.username=lightai
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=org.postgresql.Driver
# MySQL 5.7 / 8.0:
# spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lightai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

